name: engine-re

# One-shot RE diagnostics: locate the CS:GO engine's challenge-reply parser
# ("Invalid challenge packet." string) in the bundle's engine binary and dump
# the disassembly around every RIP-relative xref (tools/engine_challenge_xref.py).
# Answers: which fields does the client expect in an S2C_CHALLENGE ('A') reply?

on:
  workflow_dispatch: {}

jobs:
  re:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      C2B_GAME_DIR: ${{ github.workspace }}/csgo-lite
      MEGA_URL: ${{ secrets.MEGA_URL }}
      MEGA_USER: ${{ secrets.MEGA_USER }}
      MEGA_PASS: ${{ secrets.MEGA_PASS }}
    steps:
      - uses: actions/checkout@v4

      - name: restore bundle cache
        id: cache-bundle
        uses: actions/cache/restore@v4
        with:
          path: ~/csgo-lite
          key: csgo-lite-v1

      - name: fetch lite bundle if cache missed
        if: steps.cache-bundle.outputs.cache-hit != 'true'
        run: bash scripts/fetch-bundle.sh "$C2B_GAME_DIR"
      - name: make bundle tree writable
        run: |
          [ -d "$C2B_GAME_DIR" ] || { echo "::error::no bundle at $C2B_GAME_DIR"; exit 1; }
          chmod -R u+rwX "$C2B_GAME_DIR"

      - name: find engine binary
        id: find
        run: |
          set -u
          mkdir -p re-out
          E=""
          for f in $(find "$C2B_GAME_DIR" -name '*.so' 2>/dev/null); do
            if grep -aq 'Invalid challenge packet' "$f" 2>/dev/null; then
              E="$f"; echo "FOUND: $f"; break
            fi
          done
          if [ -z "$E" ]; then
            echo "::warning::no .so with challenge string; monolith fallback"
          fi
          echo "engine=$E" >> "$GITHUB_OUTPUT"
          # run124 lesson: runtime client = monolithic csgo_linux64 (phdr shows
          # NO engine_client.so module; bundle's .so's are legacy leftovers).
          # Always ship the monolith + map of which binaries carry the connless
          # strings, so offline RE targets the ACTUAL runtime code.
          M="$C2B_GAME_DIR/csgo_linux64"
          if [ -x "$M" ]; then
            echo "monolith=$M ($(du -h "$M" | cut -f1))"
            grep -aq 'Invalid challenge packet' "$M" \
              && echo "monolith HAS challenge strings" || echo "monolith lacks challenge strings"
            grep -aq 'ProcessConnectionlessPacket' "$M" \
              && echo "monolith HAS ProcessConnectionlessPacket" || true
          else
            echo "::warning::no csgo_linux64 at $M"
          fi
          for f in "$C2B_GAME_DIR"/csgo_linux64 "$C2B_GAME_DIR"/bin/linux64/*.so; do
            [ -f "$f" ] || continue
            grep -aq 'LanSearch' "$f" 2>/dev/null && echo "LanSearch-IN: $f"
          done | head -10 > re-out/monolith-scan.txt
          cat re-out/monolith-scan.txt
          strings -t x "$E" 2>/dev/null | grep -aiE 'qconnect|Invalid challenge|getchallenge|Connecting to public' \
            | head -40 > re-out/strings.txt || true

      - name: xref disassembly
        if: steps.find.outputs.engine != ''
        run: |
          set -u
          export ENGINE="${{ steps.find.outputs.engine }}"
          python3 tools/engine_challenge_xref.py > re-out/xrefs.txt 2>&1
          wc -l re-out/xrefs.txt
          grep -c '=====' re-out/xrefs.txt || true

      - name: upload the engine binary itself (12MB, for local deep RE)
        if: always()
        run: |
          set -u
          E="${{ steps.find.outputs.engine }}"
          if [ -n "$E" ] && [ -f "$E" ]; then
            cp -f "$E" re-out/engine_client.so
            sha256sum re-out/engine_client.so > re-out/engine.sha256
          fi
          # monolith: the REAL runtime binary (csgo_linux64) — needed to derive
          # g13 RVAs for the engine connless dispatcher in the live process
          M="$C2B_GAME_DIR/csgo_linux64"
          if [ -f "$M" ]; then
            cp -f "$M" re-out/csgo_linux64
            sha256sum re-out/csgo_linux64 > re-out/csgo_linux64.sha256
          fi

      - name: upload RE artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: engine-re
          path: re-out/
          retention-days: 30
