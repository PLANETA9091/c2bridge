name: e2e-cloud

# FREE e2e on GitHub HOSTED runners — no user PC, no VPS.
#
#   runs-on: ubuntu-latest   (public repo: free minutes; private: 2000 min/mo)
#
# Where the heavy bytes come from:
#   - CS:GO "lite bundle" (minimal client, ~1-3 GiB, packed by tools/pack-bundle.sh)
#     lives in a PRIVATE MEGA folder -> actions/cache keeps it (10 GiB cap), MEGA is
#     hit only on cache misses. Valve assets NEVER enter the repo.
#   - Steam client + runtime + login sentry (~1.5 GiB) are cached too, so the
#     burner account's Steam Guard code is needed only on the very first run.
#
# Modes:
#   smoke (daily schedule): boot legacy client headless -> main menu + bridge
#     evidence. No server connect, no target involvement.
#   full (manual): smoke + steam://connect/<target> e2e attempt with translate on.
#   farm (manual): fake-S1-server response matrix (tools/fake_s1_server.py) on
#     loopback: which wire response makes the legacy engine SEND its connect
#     packet (the CL v2 phase-B capture prize). Bridge passive, engine vanilla.

# runs 118-121 lesson: parallel e2e runs share ONE burner Steam account and
# fight over the steam-node-v4 cache. Second login KICKS the first session
# (BLoggedOn=0 -> GNS dead -> no evidence), cache saves race ("Unable to
# reserve cache"). Serialize all e2e-cloud runs.
concurrency:
  group: e2e-cloud
  cancel-in-progress: false

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "smoke = boot only; full = boot + connect; farm = response matrix"
        default: "full"
        type: choice
        options: [smoke, full, farm]
      target:
        description: "CS2 target ip:port (full mode)"
        default: "152.233.19.133:28022"
        required: false
      steam_guard_code:
        description: "Steam Guard code (ONLY for the very first run / new device)"
        required: false
      run_all:
        description: "smoke: run ALL attempts despite early PASS (max evidence)"
        default: "1"
        type: choice
        options: ["1", "0"]
      dsites:
        description: "v60: C2B_DSITES site-filter: 'all' = v59b (8 sites); 'none' = sites-OFF; subset = CSV. DEFAULT = 7 sites minus wr2 — run420-425: wr2 (libc write() cancellable path, the S_API-pipe 13-14B writes fd=6464) = the instant-death site (the engine startup protocol corrupted); the other 7 = PASS run425 with the live FIRE telemetry"
        default: "csp1,csp2,csp3,snd,smg,smsg,wr1"
        required: false
        type: string
      dwell:
        description: "g94: post-marker dwell seconds; 90 = legacy; 300 = the 5-min soak milestone (use run_all=0 for the long soaks: 5 attempts x 300s dwell = the 60-min job-timeout risk)"
        default: "90"
        required: false
        type: string
      fire_abi:
        description: "v67/v69: FIRE verbosity: 0 = v64 line (PROVEN-SAFE, DEFAULT); 1 = +buf/fl/ad/al registers; 2 = +st0..3 (GUARDED, sp-arg FIXED v68); 3 = +st0..15 = 128B caller-frame walk (the caller-code-pointer hunt)"
        default: "0"
        required: false
        type: choice
        options: ["0", "1", "2", "3"]
      k27form:
        description: "v73: the k27 answer/ask form: 4 = verbatim-echo ask; 5 = ask+verbatim-answer (run462); 6 = ask+%011x(val)-answer (v72: the CORRECT shifts); 7 = the answer = the engine's own win-string 'connect-granted0x' (22B, v73: the last untried in-channel string; run466 = 7 + ansolo=1 = the single-variable A/B vs run464). DEFAULT 6 = the run463 state"
        default: "6"
        required: false
        type: choice
        options: ["1", "2", "3", "4", "5", "6", "7"]
      ansolo:
        description: "v72: ANSOLO = the answer WITHOUT the ask (C2B_K27ANSOLO=1; requires k27form>=5). run464 = k27form=5 + ansolo=1 = the single-variable A/B vs run462 (the answer bytes identical, the ask suppressed). 0 = the ask+answer pair (the run462/463 dynamics)"
        default: "0"
        required: false
        type: choice
        options: ["0", "1"]
      krel:
        description: "v79: the FULL-ff×4 engine-'k' relay in-channel (C2B_KREL=1): the mirror of the server's own ff×4-'A' framing (run481 decrypt: the server itself sends ff×4-prefixed packets in-channel => the noff4-only rationale void); chal = A.chal verbatim. Default 0 = krel OFF (the run479-481 behavior)"
        default: "0"
        required: false
        type: choice
        options: ["0", "1"]
      gpr:
        description: "v75: the raw-syscall stub patcher (C2B_GPR=1): scans the engine/steam file-backed r-x modules for raw sendto/sendmsg stubs (mov eax,nr; syscall) and redirects them into the bridge hooks (the crt-fix finally gets the engine's native 0x22s). DEFAULT 1 = ARMED (the run469 experiment); '0' = OFF = the exact run468 behavior (the rollback lever)"
        default: "1"
        required: false
        type: choice
        options: ["0", "1"]
      mpw:
        description: "v76: the exec-watcher (C2B_MPW=1): LD_PRELOAD-interposes mprotect/mmap/mmap64 and censuses every exec-protected range ON THE SPOT (fixed A/B + '?'-class + REX-dispatcher '48 89 f8 0f 05' + raw05 taxonomy) with the caller module attribution = catches the TRANSIENT JIT stub class (the last unexplained native-lane sender after the full static elimination matrix). Census-only, no patching. '0' = pure passthrough"
        default: "1"
        required: false
        type: choice
        options: ["0", "1"]
      k21wait:
        description: "v81: the krel k21-wait lever: '0' = the krel does NOT wait for the (blind) engine-session scan / br-live probe and sends the FULL-ff x4 'k' (chal=A.chal) on the BRIDGE session slot 11 (the same healthy session the server's 'A' arrives on; k27 delivers rc=1 there, verified on-wire). '1' (default) = the run479-484 wait behavior (zero krel sends when both probes are blind). Requires krel=1 to matter."
        default: "1"
        required: false
        type: choice
        options: ["0", "1"]
      gap:
        description: "v82c-d: the NON-ADJACENT (gap) sys-stub patcher arm (C2B_GAP=1): libc's HOT sendto stub in a multithreaded process = the non-adjacent window (mov eax,44; mov rdx/[rbp]; mov rsi/[rbp]; syscall; errno-check) that the v77c adjacent-only scan MISSED (run487 proof: the engine's raw sends bypassed every hook). run488 = the default-on attempt: INSTANT startup death (SEGV foreign in an anon GOT-stub, rax=1 = the dlsym-fail sentinel) => default '0' = the run487 behavior (adjacent windows only). Re-arm ONLY after the g90a dump analysis (worklog cron-30min-202610150739)."
        default: "0"
        required: false
        type: choice
        options: ["0", "1"]
      crtfix:
        description: "v82: the crt-rewrite ARM (C2B_CRTFIX=1): the engine's BROKEN 0x22 connreq is rewritten IN-FLIGHT into the accepted modern form. run485 pcap field-walk: the engine's form is now [22][fb 00] 254B WITH the native cert INSIDE (f4=174B = the cert-inject works) but (1) the legacy u16-LE prefix = invalid protobuf under the modern parser (f31/wt3), (2) f2 = wt2 without LEN (the v50 bug lives), (3) f7 unsigned 38B => the server silently re-challenges forever. Rewrite = [22][0d cid][11 chal][19 sid][22 cert][29 ts][30 ping][3a f7-engine] = the exact form the server already 0x23-ConnectOK'd (run485 session ports). '0' (default) = the run479-485 behavior (passive cert capture only)."
        default: "0"
        required: false
        type: choice
        options: ["0", "1"]
      timeout_min:
        description: "v72c: DEPRECATED/UNUSED — the job timeout = HARDCODED 80 below (the job-level timeout-minutes = the expression via inputs = REJECTED workflow-level: run38518494260 (string) AND run38518912181 (number) = both 0-jobs instant-fail => the inputs context = NOT available in jobs.<id>.timeout-minutes). 80 fits the 3600s soak (~65 min wall); the 90s runs = unaffected (the timeout = a cap)."
        default: 60
        required: false
        type: number
  schedule:
    - cron: "0 4 * * *"   # daily 04:00 UTC smoke

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    env:
      MODE: ${{ inputs.mode || 'smoke' }}
      C2B_TARGET: ${{ inputs.target || '152.233.19.133:28022' }}
      C2B_NODE_HOME: ${{ github.workspace }}/c2b-node
      # g111 BISECT (runs 308-316 = 7 consecutive menu=0; run311 a1 = the
      # bridge's own SEGV handler fired: 'SEGV foreign rip=<bridge>+0x10400'
      # = the crash INSIDE the bridge code, right after the g105 install
      # readback; the first flake = exactly the g109 commit e5a1f96 = the
      # ungated sendto/sendmsg census). C2B_G109=0 = the census OFF = THE
      # single-variable bisect. IF the menu = PASS => the census = the killer
      # (the campaign = done => default-off or the fix). The bridge-symbol
      # map = added to the artifact (the ci-collect) = any future crash
      # rip-offset resolves to the fn name.
      C2B_G109: "0"
      # v53b/v54: ядерная правда о send-классе. STRACEGame = ВЫКЛ (run401/402:
      # TracerPid != 0 = анти-дебуг движка = отправитель 0x22 НЕ СТРЕЛЯЕТ под
      # любым трейсером — наблюдаемая добилась обратного). TRACEFS_GAME =
      # kernel-side syscalls tracepoint БЕЗ ptrace: анти-дебуг слеп, движок
      # живёт как обычно; trace = pid+tid+fd+len+timestamp -> tracefs_send.log
      # в артефакте; кросс-реф len=512/timestamps с pcap = отправитель назван.
      TRACEFS_GAME: "1"
      # v55: PERF CALLCHAIN — сайт raw-syscall назван (RIP + цепочка
      # вызовов). perf_event_open = НЕ ptrace = TracerPid = 0 = анти-дебуг
      # слеп (класс tracefs run403 = движок стрелял). Фильтр = класс 0x22
      # (len == 512); -g dwarf = user-callchain; -I = user-regs = RIP =
      # адрес insn syscall. Выход: perf_send.a*.data + .txt (perf script,
      # символика на раннере) = module+offset отправителя = ЦЕЛЬ v56.
      PERFCALL: "1"
      C2B_GAME_DIR: ${{ github.workspace }}/csgo-lite
      # v60: the C2B_DSITES bisect lever (run417/418 FAIL menu=0 = the v59
      # guilt UNPROVEN — clean-exit profile = flake plausible). 'all' = the
      # v59b behavior (all 8 sites); '' = the sites OFF (run419 = the exact
      # copy of the PASS-tree 404-416 => PASS = v59 guilty => site-bisect;
      # FAIL = the runner flake); 'wr1,wr2' = the subset (site-bisect).
      C2B_DSITES_V: ${{ inputs.dsites || 'all' }}
      # v67: the FIRE-ABI discriminator (0 = the proven-safe v64 volume).
      # The default '0' = a truthy STRING => passes the || (the sentinel
      # discipline: the value '0' never equals the unset-default path).
      C2B_FIRE_ABI_V: ${{ inputs.fire_abi || '0' }}
      # v72: the k27 form/ansolo dispatch levers (the sentinel discipline
      # as v67: the defaults are truthy strings = pass the ||).
      C2B_K27FORM_V: ${{ inputs.k27form || '6' }}
      C2B_K27ANSOLO_V: ${{ inputs.ansolo || '0' }}
      C2B_KREL_V: ${{ inputs.krel || '0' }}
      # v75: the raw-syscall stub patcher lever (default '1' = ARMED;
      # '0' = the run468 behavior, the rollback path).
      C2B_GPR_V: ${{ inputs.gpr || '1' }}
      # v76: the exec-watcher lever (default '1' = census on; '0' =
      # the passthrough-only rollback path).
      C2B_MPW_V: ${{ inputs.mpw || '1' }}
      # v81: the k21-wait lever (run484 finding: the krel body runs (v80 fix
      # verified: k21 eng-scan + k24 wait lines present) but the k21 engscan
      # = blind (eng-h=0, the u32-hash-handle scan gap) AND c2b_k24_brlive
      # = blind (slot-17 info zeros on a connected session) => g_k21_wait
      # (default ON) returns silently forever = ZERO krel sends despite all
      # the gate inputs present. k21wait='0' = the krel falls through and
      # sends on hsend = g_gns_conn_h = THE BRIDGE SESSION slot 11 = the
      # same session the server's 'A' arrives on and where k27 delivers
      # rc=1 verified-on-wire. Default '1' = the run479-484 wait behavior
      # (the single-variable discipline: only krel=1+k21wait=0 changes).
      C2B_K21WAIT_V: ${{ inputs.k21wait || '1' }}
      # v82: the crt-rewrite arm (crtfix='1' -> C2B_CRTFIX=1 in MODES). The
      # engine's broken [22][fb 00] connreq (cert inside, but legacy-prefix +
      # broken-f2 + unsigned-f7 = the silent re-challenge loop) rewritten
      # in-flight into the accepted modern form. Default '0' = the
      # run479-485 behavior (the rewrite OFF, the passive capture only).
      C2B_CRTFIX_V: ${{ inputs.crtfix || '0' }}
      # v82c-d: the gap-stub patcher arm (default OFF = the run487 behavior;
      # the run488 default-on attempt = the startup death, see the input note).
      C2B_GAP_V: ${{ inputs.gap || '0' }}
      # v63: the g94 post-marker dwell knob. NOTE the sentinel discipline:
      # inputs.x || default eats the EMPTY string ('' -> 90), but '0' (the
      # legacy no-dwell) arrives as the STRING "0" = truthy in the GH
      # expressions = passes through — all the meaningful values are safe.
      C2B_POST_DWELL_V: ${{ inputs.dwell || '90' }}
      STEAM_USER: ${{ secrets.STEAM_USER }}
      STEAM_PASS: ${{ secrets.STEAM_PASS }}
      STEAM_GUARD_CODE: ${{ inputs.steam_guard_code || secrets.STEAM_GUARD_CODE }}
      MEGA_URL: ${{ secrets.MEGA_URL }}
      MEGA_USER: ${{ secrets.MEGA_USER }}
      MEGA_PASS: ${{ secrets.MEGA_PASS }}
    steps:
      - uses: actions/checkout@v4

      # ---------- caches: bundle + steam client/sentry ----------
      # NOTE: actions/cache@v4 combined form is unusable here — its save-always
      # input is deprecated AND broken ("does not work as intended"): on a failed
      # job the post-save is skipped, so NO run ever populated the cache and every
      # run re-fetched 1.29 GiB from MEGA (run 12 log: "Cache not found for input
      # keys: csgo-lite-v1"). Explicit restore + save-always() pair instead.
      - name: restore bundle cache
        id: cache-bundle
        uses: actions/cache/restore@v4
        with:
          # run 117: was ~/csgo-lite but fetch-bundle.sh unpacks into
          # $C2B_GAME_DIR = ${{ github.workspace }}/csgo-lite - cache was
          # saved from an EMPTY dir and every run re-fetched 2 GiB from MEGA.
          path: ${{ github.workspace }}/csgo-lite
          key: csgo-lite-v1
      - name: restore steam client cache (runtime + sentry = silent logins)
        id: cache-steam
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.local/share/Steam
            ~/.steam
          key: steam-node-v4
          # v4 = client + VALID login session (saved only after a successful
          # login). v3/v2 = client-only fallback so we skip the bootstrap.
          restore-keys: |
            steam-node-v3
            steam-node-v2

      # ---------- system deps (each hosted run starts from a clean VM) ----------
      - name: install system packages
        run: |
          set -euo pipefail
          sudo dpkg --add-architecture i386
          sudo apt-get update -qq
          # CS:GO engine modules are dlopen'ed from bin/linux64/*.so; a missing
          # NEEDED lib makes that dlopen fail with only the 32-bit probe's
          # wrong-ELF-class error printed (silent fatal, run 37123582445).
          # The t64/non-t64 variants differ between Ubuntu releases - try both.
          sudo apt-get install -y -qq \
            xvfb xdotool x11-utils x11-xserver-utils xkb-data \
            strace zstd curl jq rsync build-essential gdb imagemagick x11-apps tcpdump \
            libc6:i386 libstdc++6:i386 libglib2.0-0:i386 \
            libnss3:i386 libx11-6:i386 libgbm1:i386 libgl1:i386 \
            libcurl3-gnutls libasound2t64 libpulse0 \
            libxrandr2 libxcursor1 libxi6 libxinerama1 libxxf86vm1 \
            libxss1 libxkbcommon0 libwayland-client0 libwayland-cursor0 \
            libxrender1 libxext6 libxfixes3 libxcomposite1 libxdamage1 \
            libudev1 libdbus-1-3 libatk1.0-0t64 libatk-bridge2.0-0t64 \
            libcups2t64 libgtk-3-0t64 libnm0 libopenal1 \
          || sudo apt-get install -y -qq \
            xvfb xdotool x11-utils x11-xserver-utils xkb-data \
            strace zstd curl jq rsync build-essential gdb imagemagick x11-apps tcpdump \
            libc6:i386 libstdc++6:i386 libglib2.0-0:i386 \
            libnss3:i386 libx11-6:i386 libgbm1:i386 libgl1:i386 \
            libcurl3-gnutls libasound2 libpulse0 \
            libxrandr2 libxcursor1 libxi6 libxinerama1 libxxf86vm1 \
            libxss1 libxkbcommon0 libwayland-client0 libwayland-cursor0 \
            libxrender1 libxext6 libxfixes3 libxcomposite1 libxdamage1 \
            libudev1 libdbus-1-3 libatk1.0-0 libatk-bridge2.0-0 \
            libcups2 libgtk-3-0 libnm0 libopenal1
          # Ubuntu 24.04: AppArmor restricts unprivileged user namespaces and
          # modern Steam REFUSES to start without them (zenity "Steam now
          # requires user namespaces" -> no IPC pipe -> SteamAPI_Init fatal).
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          # Memory headroom (run 37135148290): steam client logged 102x
          # "mmap() failed: Cannot allocate memory" at startup and every
          # engine launch died in a protobuf static-init SEGV; the only run
          # with a HEALTHY client (37128611184 a2) sailed to D3D9. Give the
          # runner swap + permissive overcommit + a large map budget.
          if ! swapon --show 2>/dev/null | grep -q .; then
            sudo fallocate -l 8G /swapfile 2>/dev/null || sudo dd if=/dev/zero of=/swapfile bs=1M count=8192 status=none
            sudo chmod 600 /swapfile && sudo mkswap -q /swapfile && sudo swapon /swapfile \
              && echo "swap enabled: $(swapon --show --noheadings)" || echo "WARNING: swap setup failed"
          fi
          sudo sysctl -w vm.overcommit_memory=1 || true
          sudo sysctl -w vm.max_map_count=1048576 || true
          # v55: perf = perf_events юзерленд (НЕ ptrace, анти-дебуг слеп).
          # Версионный бинарь может не совпасть с ядром раннера — харнесс
          # резолвит /usr/lib/linux-tools/*/perf напрямую. Soft-fail:
          # отсутствие perf = минус callchain, ран живёт (tracefs остаётся).
          sudo apt-get install -y -qq linux-tools-common linux-tools-generic linux-tools-azure 2>/dev/null \
            || sudo apt-get install -y -qq linux-tools-common linux-tools-generic 2>/dev/null \
            || true
          # Steam client: official steam.deb. NOTE: the apt-repo route is dead —
          # Valve's steam.asc key URL 404s (2026-10), which killed run 37115551190.
          if ! [ -x "$HOME/.local/share/Steam/steam.sh" ] && ! command -v steam >/dev/null; then
            curl -fsSL -o /tmp/steam.deb https://steamcdn-a.akamaihd.net/client/installer/steam.deb
            sudo apt-get install -y -qq /tmp/steam.deb
          fi

      # ---------- bundle ----------
      - name: fetch lite bundle if cache missed
        if: steps.cache-bundle.outputs.cache-hit != 'true'
        run: bash scripts/fetch-bundle.sh "$C2B_GAME_DIR"
      - name: make bundle tree writable
        run: |
          [ -d "$C2B_GAME_DIR" ] || { echo "::error::no bundle at $C2B_GAME_DIR"; exit 1; }
          chmod -R u+rwX "$C2B_GAME_DIR"
          du -sh "$C2B_GAME_DIR"; ls "$C2B_GAME_DIR" | head

      # ---------- bridge ----------
      - name: build bridge artifacts
        run: |
          mkdir -p "$C2B_NODE_HOME/bridge/lib12"
          gcc -O2 -shared -fPIC -o "$C2B_NODE_HOME/bridge/c2bridge64.so" src/c2bridge.c -ldl
          gcc -O2 -shared -fPIC -o "$C2B_NODE_HOME/bridge/c2b_spy64.so" src/c2b_spy.c -ldl
          # 41e-k: A2S shim for the STEAM CLIENT process (the A2S_INFO query
          # in the connect flow is done by the client, not the engine — run 85)
          gcc -O2 -shared -fPIC -o "$C2B_NODE_HOME/bridge/c2b_a2s_shim.so" src/c2b_a2s_shim.c -ldl
          # g110: CLIENT-SIDE SDR-crypto hook (the chacha ctr32 capture in the
          # client's steamclient.so = the :57343 relay endpoint = the crypto
          # holder, the g109b census verdict). BOTH arches: the client core =
          # the 32-bit ubuntu12_32/steam (the 00a027 offsets), the 64-bit =
          # the insurance (the d975c5 offsets). gcc-multilib = the -m32 build.
          sudo apt-get install -y -qq gcc-multilib >/dev/null 2>&1 || true
          gcc -m32 -O2 -shared -fPIC -o "$C2B_NODE_HOME/bridge/c2b_client_hook.so" \
            src/c2b_client_hook.c -lpthread || echo "WARN: c2b_client_hook(32) build failed"
          gcc -m64 -O2 -shared -fPIC -o "$C2B_NODE_HOME/bridge/c2b_client_hook64.so" \
            src/c2b_client_hook.c -lpthread || echo "WARN: c2b_client_hook64 build failed"
          file "$C2B_NODE_HOME"/bridge/c2b_client_hook*.so || true
          # tcmalloc shim: crash-bisect variant of the bundle's 2013 tcmalloc
          # (pure glibc forwarder; run 21/22/23 deterministic protobuf SEGV)
          gcc -O2 -shared -fPIC -o "$C2B_NODE_HOME/bridge/tcmalloc_shim.so" src/tcmalloc_shim.c
          gcc -O2 -DC2B_SELFTEST -o /tmp/c2b-selftest src/c2bridge.c && /tmp/c2b-selftest

      - name: stage libpng12 (bundle lib12 first, build-from-source fallback)
        run: |
          if compgen -G "$C2B_GAME_DIR/lib12/libpng12*" >/dev/null; then
            cp -f "$C2B_GAME_DIR"/lib12/* "$C2B_NODE_HOME/bridge/lib12/"
          elif compgen -G "lib12/libpng12*" >/dev/null; then
            cp -f lib12/* "$C2B_NODE_HOME/bridge/lib12/"
          else
            curl -sL https://sourceforge.net/projects/libpng/files/libpng12/1.2.59/libpng-1.2.59.tar.gz \
              | tar xz -C /tmp
            (cd /tmp/libpng-1.2.59 && ./configure --prefix=/usr >/dev/null && make -j2 >/dev/null 2>&1 || true)
            find /tmp/libpng-1.2.59/.libs -name 'libpng12.so.0*' \
              -exec cp -f {} "$C2B_NODE_HOME/bridge/lib12/" \; 2>/dev/null || true
          fi
          ls -la "$C2B_NODE_HOME/bridge/lib12/"

      # ---------- steam session ----------
      - name: probe credentials (steamcmd - invalid password vs steam guard)
        run: |
          # SKIP when a guard code is provided: a bare login attempt would
          # trigger a NEW guard email and invalidate the user's fresh code
          if [ -n "$STEAM_GUARD_CODE" ]; then echo "guard code provided — skip probe (avoid code invalidation)"; exit 0; fi
          if [ -z "$STEAM_USER" ]; then echo "STEAM_USER not set — skip probe"; exit 0; fi
          sudo apt-get install -y -qq lib32gcc-s1 >/dev/null 2>&1 || true
          mkdir -p /tmp/steamcmd && cd /tmp/steamcmd
          [ -x steamcmd.sh ] || { curl -fsSL -o sc.tar.gz https://steamcdn-a.akamaihd.net/client/installer/steamcmd_linux.tar.gz && tar xzf sc.tar.gz; }
          set +e
          timeout 90 ./steamcmd.sh +login "$STEAM_USER" "$STEAM_PASS" +quit > probe.log 2>&1
          RC=$?
          set -e
          # classify WITHOUT leaking secrets
          if grep -qiE 'Steam Guard|Two-factor|two factor|set_steam_guard_code' probe.log; then
            echo "PROBE RESULT: STEAM_GUARD — account requires a one-time code (pass via steam_guard_code input once)"
          elif grep -qiE 'Invalid Password|FAILED login|error code Five' probe.log; then
            echo "PROBE RESULT: INVALID PASSWORD — fix the STEAM_PASS secret"
          elif grep -qiE 'waiting for user to enter|confirmation code|email' probe.log; then
            echo "PROBE RESULT: STEAM_GUARD_EMAIL — code sent to the account email"
          elif grep -qi 'Logged in OK' probe.log; then
            echo "PROBE RESULT: LOGGED_IN_OK — credentials valid, NO guard on account"
          else
            echo "PROBE RESULT: OTHER (rc=$RC) — see steamcmd-probe.log artifact"
            tail -15 probe.log | sed 's/[A-Za-z0-9@#$%^&*()_+-]\{8,\}/[redacted]/g'
          fi
          cp -f probe.log "$C2B_NODE_HOME/steamcmd-probe.log" 2>/dev/null || true

      - name: bootstrap steam client (first run downloads runtime)
        run: |
          if [ -x "$HOME/.local/share/Steam/steam.sh" ]; then echo "steam cached, skip bootstrap"; exit 0; fi
          (steam --silent >/tmp/steam-bootstrap.log 2>&1 &) || true
          for i in $(seq 1 60); do
            [ -x "$HOME/.local/share/Steam/steam.sh" ] && sleep 20 && echo "bootstrap done (~$((i*5+20))s)" && exit 0
            sleep 5
          done
          echo "::warning::steam bootstrap may be incomplete; steam-login.sh will retry"

      - name: steam login (burner account)
        id: login
        run: |
          if [ -z "$STEAM_USER" ]; then
            echo "STEAM_USER not set — skipping login (smoke boots standalone; full mode needs the burner account)"
            exit 0
          fi
          # g112b (runs 319/320 autopsy): the fresh -login session = RAM-ONLY
          # (the client stores NO refresh token when RememberPassword=0 at
          # login time; the vdf flags = NOT credentials) => ANY later client
          # boot = the logon-fail loop => the game dead at +6s. The ONLY
          # surviving session = the login client ITSELF => it MUST be
          # preloaded with the g110 hook so the harness ADOPTS it (the
          # /proc/<pid>/environ check skips the controlled restart = no
          # pkill = the session survives into the game launches). The hook =
          # built by the 'build bridge artifacts' step BEFORE this step.
          if [ "${C2B_G110:-1}" != "0" ] && [ -f "$C2B_NODE_HOME/bridge/c2b_client_hook.so" ]; then
            export C2B_CLIENT_PRELOAD="$C2B_NODE_HOME/bridge/c2b_client_hook.so"
            echo "g112b: login client will be preloaded with $C2B_CLIENT_PRELOAD"
          else
            echo "g112b: hook not built or C2B_G110=0 - login client = hookless (the harness will do the controlled restart; the logon-fail risk = known)"
          fi
          # run 39: a memory-starved client (mmap() failed x17 during boot on a
          # flaky runner VM) fails the logged-in check. Retry the login up to 3
          # times, killing the client between attempts.
          ok=0
          for i in 1 2 3; do
            if bash scripts/steam-login.sh; then ok=1; break; fi
            echo "::warning::steam login attempt $i failed"
            tail -30 /tmp/c2b-steam-login.log || true
            pkill -9 -f 'ubuntu12_32/steam' 2>/dev/null || true
            pkill -9 -f steamwebhelper 2>/dev/null || true
            sleep 5
          done
          if [ "$ok" != "1" ]; then
            if [ "$MODE" = "smoke" ]; then
              echo "::warning::steam login failed — continuing (smoke boots standalone; a Steam Guard code may be needed once)"
              tail -50 /tmp/c2b-steam-login.log || true
            else
              echo "::error::steam login failed — set STEAM_USER/STEAM_PASS, and for the"
              echo "          very first run pass STEAM_GUARD_CODE (email code) via workflow input."
              tail -50 /tmp/c2b-steam-login.log || true
              exit 1
            fi
          fi
          # v4 steam cache is saved ONLY from runs with a real login session
          # (a session cached from a failed login is worthless and would
          # poison the immutable key).
          echo "login_ok=$ok" >> "$GITHUB_OUTPUT"

      # ---------- e2e ----------
      - name: run e2e (${{ env.MODE }})
        run: |
          cp -f scripts/steam-login.sh "$C2B_NODE_HOME/steam-login.sh"
          echo "$C2B_TARGET" > "$C2B_NODE_HOME/target.conf"
          if [ "$MODE" = "smoke" ]; then
            # observe mode: bridge preloaded but NOT patching (the translate
            # GOT-patch crashes protobuf init on the runner's glibc - run 16
            # gdb backtrace). Smoke only needs menu + preload evidence.
            # 5 attempts: the protobuf static-init SEGV is nondeterministic
            # (survived in 37128611184 a2, died in 37135148290 a1-a3) - retry
            # through it; a dead attempt costs ~15s since the liveness fix.
            C2B_SMOKE=1 C2B_TRANSLATE=0 C2B_ATTEMPTS=5 \
              C2B_RUN_ALL="${{ inputs.run_all || '1' }}" bash run-test-node.sh
          elif [ "$MODE" = "farm" ]; then
            # fake-S1-server response matrix (tools/fake_s1_server.py).
            # Run 65: docker-bridge farm (non-self IP) -> engine sends
            # qconnect0x00000000 + answers 'i' with 'j' JOIN. Run 66: our
            # synthetic reserve replies still produce silence -> capture a
            # REAL CS:GO-legacy server via the Steam master and replay its
            # exact wire bytes.
            mkdir -p "$C2B_NODE_HOME/farm/legacy_ref"
            timeout 300 python3 tools/capture_legacy_ref.py \
              "$C2B_NODE_HOME/farm/legacy_ref" || echo "::warning::legacy ref capture failed (farm continues synthetic)"
            # seed the repo's LIVE-CAPTURED legacy reference (46.174.52.230
            # info_i: real EDF 0xb1 steamid 0x130000000f2cc9b, ver 1.38.8.1)
            # unless the runner-side capture produced its own
            [ -f "$C2B_NODE_HOME/farm/legacy_ref/info_i.bin" ] || \
              cp -f legacy_ref/info_i.bin "$C2B_NODE_HOME/farm/legacy_ref/info_i.bin" 2>/dev/null || true
            ls -la "$C2B_NODE_HOME/farm/legacy_ref/" || true
            docker run -d --name c2bfarm --rm \
              -v "$GITHUB_WORKSPACE/tools":/tools:ro \
              -v "$C2B_NODE_HOME":/data \
              python:3-slim \
              python3 /tools/fake_s1_server.py --bind 0.0.0.0 --port 29015 \
                --log /data/farm \
                --engine-ports-file /data/farm/engine_ports.txt \
                --push-host "$(docker network inspect bridge --format '{{(index .IPAM.Config 0).Gateway}}')"
            FARM_IP=""
            for i in $(seq 1 15); do
              FARM_IP=$(docker inspect -f '{{.NetworkSettings.IPAddress}}' c2bfarm 2>/dev/null || true)
              [ -n "$FARM_IP" ] && break
              sleep 1
            done
            [ -n "$FARM_IP" ] || { echo "::error::docker farm failed to start"; docker logs c2bfarm 2>&1 | tail -20; exit 1; }
            echo "FARM_IP=$FARM_IP" >> "$GITHUB_ENV"
            echo "farm container up at $FARM_IP:29015"
            # 5 attempts x 240s cover the whole 36-entry matrix several times.
            C2B_FARM=1 C2B_FARM_EXTERNAL=1 C2B_FARM_TARGET="$FARM_IP:29015" \
              C2B_TRANSLATE=0 C2B_ATTEMPTS=5 bash run-test-node.sh
          else
            # 5 attempts in full mode: the CLV2 'A'-reply format matrix
            # (C2B_CLV2_FMT = (attempt-1) % 5) needs all five slots.
            # g94: 90s post-marker dwell = the signon progress + longevity data.
            C2B_ATTEMPTS=5 C2B_POST_DWELL="${C2B_POST_DWELL_V}" bash run-test-node.sh
          fi

      # ---------- artifacts ----------
      - name: collect artifacts
        if: always()
        run: |
          L=$(ls -t "$C2B_NODE_HOME/runs/" 2>/dev/null | head -1) || true
          mkdir -p e2e-out
          [ -n "$L" ] && cp -f "$C2B_NODE_HOME/runs/$L"/* e2e-out/ 2>/dev/null || true
          # farm subdir (packets.log, dumps, CONNECT markers) - flat copy above
          # skips directories; docker-external farm logs to NODE_HOME/farm
          [ -n "$L" ] && cp -rf "$C2B_NODE_HOME/runs/$L/farm" e2e-out/ 2>/dev/null || true
          [ -d "$C2B_NODE_HOME/farm" ] && cp -rf "$C2B_NODE_HOME/farm" e2e-out/farm-external 2>/dev/null || true
          # steam session evidence (duplicate-safe if harness already saved it)
          cp -f ~/.steam/steam/logs/console-linux.txt e2e-out/steam-console.log 2>/dev/null || true
          cp -f ~/.local/share/Steam/config/loginusers.vdf e2e-out/loginusers.vdf 2>/dev/null || true
          cp -f /tmp/c2b-steam-login.log e2e-out/steam-login.log 2>/dev/null || true
          cp -f /tmp/c2b-steam-login-diag.txt e2e-out/steam-login-diag.txt 2>/dev/null || true
          # g110: the client-side chacha keys (the hook .so /tmp append log;
          # the harness = also copies it into the RUNDIR = the primary path)
          cp -f /tmp/c2b_client_keys.log e2e-out/client_keys_root.txt 2>/dev/null || true
          cp -f /tmp/c2b-login-screen.png e2e-out/xvfb-login.png 2>/dev/null || true
          cp -f "$C2B_NODE_HOME/steamcmd-probe.log" e2e-out/ 2>/dev/null || true
          # remaining client logs (connection_log etc.) + Xvfb screenshots:
          # the login form / guard dialog text IS the answer
          mkdir -p e2e-out/steam-logs
          for f in ~/.steam/steam/logs/*.txt ~/.local/share/Steam/logs/*.txt; do
            [ -f "$f" ] || continue
            b=$(basename "$f")
            [ "$b" = console-linux.txt ] || tail -c 200000 "$f" > "e2e-out/steam-logs/$b"
          done 2>/dev/null || true
          if command -v import >/dev/null 2>&1 && pgrep -f 'Xvfb :99' >/dev/null 2>&1; then
            DISPLAY=:99 import -window root e2e-out/xvfb-state.png 2>/dev/null || true
          fi
          # 41f-g5 heist: GNS binaries for OFFLINE RE of the 0x21->0x22 abort.
          # steamclient.so (internal GNS copy) + libsteamnetworkingsockets.so
          # (standalone). find -L: ~/.steam/steam is a symlink. Also dump the
          # config name table (verify IP_AllowWithoutAuth = enum 29).
          # 2307: + matchmaking_client.so — g18-атрибуция указала на него как
          # на второй сайт освобождения нод (0x2a029); нужен бинарник для
          # офлайн RE консьюмера/парсера ('B'-чеки).
          # run141: bundle lives in the WORKSPACE (/home/runner/work/.../csgo-lite),
          # NOT ~; modmap confirmed /home/runner/work/c2bridge/c2bridge/csgo-lite.
          # run162: + engine_client.so — РЕАЛЬНЫЙ движок (ENGINE_NAME
          # "engine_client"; g24 vtable 0xd78bb8, 'B'-парсер 0x25a8b0 — RVA
          # "engine 34a96ae"). bins его до сих пор НЕ собирали — офлайн RE
          # маршрута (d) (скан cmp-констант 0x508/0x50c) был невозможен.
          # run248 analysis: death-2 = libvstdlib_client.so+0x25606 (tier1-CRC,
          # NULL crc-context, len=7744, callers 0xe36e/0xe6c2/0x10242) — the bin
          # MUST be in the artifact for the offline RE of the caller chain.
          # head -6: steamclient даёт 4 копии, engine_client 1-2 копии.
          mkdir -p e2e-out/bins
          for name in steamclient.so libsteamnetworkingsockets.so matchmaking_client.so engine_client.so libvstdlib_client.so vstdlib_client.so; do
            find -L ~/.steam ~/.local/share/Steam "$GITHUB_WORKSPACE" /tmp -maxdepth 8 \
              -type f -name "$name" 2>/dev/null | head -6 | while IFS= read -r f; do
              tgt="e2e-out/bins/${name}__$(echo "$f" | md5sum | cut -c1-6).so"
              cp -f "$f" "$tgt" 2>/dev/null || true
              echo "$f -> $tgt" >> e2e-out/bins/heist-map.txt
            done
          done
          for f in e2e-out/bins/*.so; do
            [ -f "$f" ] || continue
            nm -D --defined-only "$f" 2>/dev/null | gzip -1 > "$f.exports.gz" || true
            { strings -a "$f" 2>/dev/null | grep -E 'IP_AllowWithoutAuth|LogLevel_|AllowWithoutAuth' | head -40; } > "$f.cfgnames.txt" || true
          done
          # g111: the CI-BUILT bridge .so + the symbol map = the crash-rip
          # decoder (run311 a1 = the SEGV rip = bridge+0x10400 = the fn was
          # UNRESOLVABLE offline: the CI gcc layout = not the local's)
          cp -f "$C2B_NODE_HOME/bridge/c2bridge64.so" e2e-out/ 2>/dev/null || true
          nm -C "$C2B_NODE_HOME/bridge/c2bridge64.so" 2>/dev/null | sort \
            > e2e-out/bridge64.syms.txt 2>/dev/null || true
          du -sh e2e-out/bins 2>/dev/null || true
          echo "=== verdict ==="; cat e2e-out/verdict.txt 2>/dev/null || true
          echo "=== harness tail ==="; tail -30 e2e-out/harness.log 2>/dev/null || true
          echo "=== login session ==="; grep -ao '"mostrecent"\s*"1"' e2e-out/loginusers.vdf 2>/dev/null || echo "NO LOGIN SESSION"

      - name: upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-cloud-${{ env.MODE }}-${{ github.run_id }}
          path: e2e-out/
          retention-days: 30

      # ---------- cache save (explicit, survives failed e2e verdicts) ----------
      - name: save bundle cache
        if: always() && steps.cache-bundle.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          # same path as restore (see run 117 note above)
          path: ${{ github.workspace }}/csgo-lite
          key: csgo-lite-v1
      - name: ensure cache dirs exist
        if: always()
        run: mkdir -p ~/.local/share/Steam ~/.steam
      - name: save steam client cache
        if: always() && steps.login.outputs.login_ok == '1'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.local/share/Steam
            ~/.steam
          key: steam-node-v4
        # run 39: "Path Validation Error" killed every save -> the sentry
        # cache never populated -> fresh VMs hit Steam Guard / degraded
        # logins. Ensure BOTH dirs exist before the save runs.
        # run 43: gated on a REAL login session; immutable v4 key then
        # carries a working sentry to every future VM (restore-keys above
        # fall back to v3/v2 client-only on miss).
