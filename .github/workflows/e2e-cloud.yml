name: e2e-cloud

# FREE e2e on GitHub HOSTED runners — no user PC, no VPS.
#
#   runs-on: ubuntu-latest   (public repo: free minutes; private: 2000 min/mo)
#
# Where the heavy bytes come from:
#   - CS:GO "lite bundle" (minimal client, ~1-3 GiB, packed by tools/pack-bundle.sh)
#     lives in a PRIVATE MEGA folder -> actions/cache keeps it (10 GiB cap), MEGA is
#     hit only on cache misses. Valve assets NEVER enter the repo.
#   - Steam client + runtime + login sentry (~1.5 GiB) are cached too, so the
#     burner account's Steam Guard code is needed only on the very first run.
#
# Modes:
#   smoke (daily schedule): boot legacy client headless -> main menu + bridge
#     evidence. No server connect, no target involvement.
#   full (manual): smoke + steam://connect/<target> e2e attempt with translate on.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "smoke = boot only; full = boot + connect"
        default: "full"
        type: choice
        options: [smoke, full]
      target:
        description: "CS2 target ip:port (full mode)"
        default: "152.233.19.133:28022"
        required: false
      steam_guard_code:
        description: "Steam Guard code (ONLY for the very first run / new device)"
        required: false
  schedule:
    - cron: "0 4 * * *"   # daily 04:00 UTC smoke

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      MODE: ${{ inputs.mode || 'smoke' }}
      C2B_TARGET: ${{ inputs.target || '152.233.19.133:28022' }}
      C2B_NODE_HOME: ${{ github.workspace }}/c2b-node
      C2B_GAME_DIR: ${{ github.workspace }}/csgo-lite
      STEAM_USER: ${{ secrets.STEAM_USER }}
      STEAM_PASS: ${{ secrets.STEAM_PASS }}
      STEAM_GUARD_CODE: ${{ inputs.steam_guard_code || secrets.STEAM_GUARD_CODE }}
      MEGA_URL: ${{ secrets.MEGA_URL }}
      MEGA_USER: ${{ secrets.MEGA_USER }}
      MEGA_PASS: ${{ secrets.MEGA_PASS }}
    steps:
      - uses: actions/checkout@v4

      # ---------- caches: bundle + steam client/sentry ----------
      # NOTE: actions/cache@v4 combined form is unusable here — its save-always
      # input is deprecated AND broken ("does not work as intended"): on a failed
      # job the post-save is skipped, so NO run ever populated the cache and every
      # run re-fetched 1.29 GiB from MEGA (run 12 log: "Cache not found for input
      # keys: csgo-lite-v1"). Explicit restore + save-always() pair instead.
      - name: restore bundle cache
        id: cache-bundle
        uses: actions/cache/restore@v4
        with:
          path: ~/csgo-lite
          key: csgo-lite-v1
      - name: restore steam client cache (runtime + sentry = silent logins)
        id: cache-steam
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.local/share/Steam
            ~/.steam
          key: steam-node-v2

      # ---------- system deps (each hosted run starts from a clean VM) ----------
      - name: install system packages
        run: |
          set -euo pipefail
          sudo dpkg --add-architecture i386
          sudo apt-get update -qq
          # CS:GO engine modules are dlopen'ed from bin/linux64/*.so; a missing
          # NEEDED lib makes that dlopen fail with only the 32-bit probe's
          # wrong-ELF-class error printed (silent fatal, run 37123582445).
          # The t64/non-t64 variants differ between Ubuntu releases - try both.
          sudo apt-get install -y -qq \
            xvfb xdotool x11-utils x11-xserver-utils xkb-data \
            strace zstd curl jq rsync build-essential gdb imagemagick x11-apps \
            libc6:i386 libstdc++6:i386 libglib2.0-0:i386 \
            libnss3:i386 libx11-6:i386 libgbm1:i386 libgl1:i386 \
            libcurl3-gnutls libasound2t64 libpulse0 \
            libxrandr2 libxcursor1 libxi6 libxinerama1 libxxf86vm1 \
            libxss1 libxkbcommon0 libwayland-client0 libwayland-cursor0 \
            libxrender1 libxext6 libxfixes3 libxcomposite1 libxdamage1 \
            libudev1 libdbus-1-3 libatk1.0-0t64 libatk-bridge2.0-0t64 \
            libcups2t64 libgtk-3-0t64 libnm0 libopenal1 \
          || sudo apt-get install -y -qq \
            xvfb xdotool x11-utils x11-xserver-utils xkb-data \
            strace zstd curl jq rsync build-essential gdb imagemagick x11-apps \
            libc6:i386 libstdc++6:i386 libglib2.0-0:i386 \
            libnss3:i386 libx11-6:i386 libgbm1:i386 libgl1:i386 \
            libcurl3-gnutls libasound2 libpulse0 \
            libxrandr2 libxcursor1 libxi6 libxinerama1 libxxf86vm1 \
            libxss1 libxkbcommon0 libwayland-client0 libwayland-cursor0 \
            libxrender1 libxext6 libxfixes3 libxcomposite1 libxdamage1 \
            libudev1 libdbus-1-3 libatk1.0-0 libatk-bridge2.0-0 \
            libcups2 libgtk-3-0 libnm0 libopenal1
          # Ubuntu 24.04: AppArmor restricts unprivileged user namespaces and
          # modern Steam REFUSES to start without them (zenity "Steam now
          # requires user namespaces" -> no IPC pipe -> SteamAPI_Init fatal).
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          # Memory headroom (run 37135148290): steam client logged 102x
          # "mmap() failed: Cannot allocate memory" at startup and every
          # engine launch died in a protobuf static-init SEGV; the only run
          # with a HEALTHY client (37128611184 a2) sailed to D3D9. Give the
          # runner swap + permissive overcommit + a large map budget.
          if ! swapon --show 2>/dev/null | grep -q .; then
            sudo fallocate -l 8G /swapfile 2>/dev/null || sudo dd if=/dev/zero of=/swapfile bs=1M count=8192 status=none
            sudo chmod 600 /swapfile && sudo mkswap -q /swapfile && sudo swapon /swapfile \
              && echo "swap enabled: $(swapon --show --noheadings)" || echo "WARNING: swap setup failed"
          fi
          sudo sysctl -w vm.overcommit_memory=1 || true
          sudo sysctl -w vm.max_map_count=1048576 || true
          # Steam client: official steam.deb. NOTE: the apt-repo route is dead —
          # Valve's steam.asc key URL 404s (2026-10), which killed run 37115551190.
          if ! [ -x "$HOME/.local/share/Steam/steam.sh" ] && ! command -v steam >/dev/null; then
            curl -fsSL -o /tmp/steam.deb https://steamcdn-a.akamaihd.net/client/installer/steam.deb
            sudo apt-get install -y -qq /tmp/steam.deb
          fi

      # ---------- bundle ----------
      - name: fetch lite bundle if cache missed
        if: steps.cache-bundle.outputs.cache-hit != 'true'
        run: bash scripts/fetch-bundle.sh "$C2B_GAME_DIR"
      - name: make bundle tree writable
        run: |
          [ -d "$C2B_GAME_DIR" ] || { echo "::error::no bundle at $C2B_GAME_DIR"; exit 1; }
          chmod -R u+rwX "$C2B_GAME_DIR"
          du -sh "$C2B_GAME_DIR"; ls "$C2B_GAME_DIR" | head

      # ---------- bridge ----------
      - name: build bridge artifacts
        run: |
          mkdir -p "$C2B_NODE_HOME/bridge/lib12"
          gcc -O2 -shared -fPIC -o "$C2B_NODE_HOME/bridge/c2bridge64.so" src/c2bridge.c -ldl
          gcc -O2 -shared -fPIC -o "$C2B_NODE_HOME/bridge/c2b_spy64.so" src/c2b_spy.c -ldl
          gcc -O2 -DC2B_SELFTEST -o /tmp/c2b-selftest src/c2bridge.c && /tmp/c2b-selftest

      - name: stage libpng12 (bundle lib12 first, build-from-source fallback)
        run: |
          if compgen -G "$C2B_GAME_DIR/lib12/libpng12*" >/dev/null; then
            cp -f "$C2B_GAME_DIR"/lib12/* "$C2B_NODE_HOME/bridge/lib12/"
          elif compgen -G "lib12/libpng12*" >/dev/null; then
            cp -f lib12/* "$C2B_NODE_HOME/bridge/lib12/"
          else
            curl -sL https://sourceforge.net/projects/libpng/files/libpng12/1.2.59/libpng-1.2.59.tar.gz \
              | tar xz -C /tmp
            (cd /tmp/libpng-1.2.59 && ./configure --prefix=/usr >/dev/null && make -j2 >/dev/null 2>&1 || true)
            find /tmp/libpng-1.2.59/.libs -name 'libpng12.so.0*' \
              -exec cp -f {} "$C2B_NODE_HOME/bridge/lib12/" \; 2>/dev/null || true
          fi
          ls -la "$C2B_NODE_HOME/bridge/lib12/"

      # ---------- steam session ----------
      - name: probe credentials (steamcmd - invalid password vs steam guard)
        run: |
          # SKIP when a guard code is provided: a bare login attempt would
          # trigger a NEW guard email and invalidate the user's fresh code
          if [ -n "$STEAM_GUARD_CODE" ]; then echo "guard code provided — skip probe (avoid code invalidation)"; exit 0; fi
          if [ -z "$STEAM_USER" ]; then echo "STEAM_USER not set — skip probe"; exit 0; fi
          sudo apt-get install -y -qq lib32gcc-s1 >/dev/null 2>&1 || true
          mkdir -p /tmp/steamcmd && cd /tmp/steamcmd
          [ -x steamcmd.sh ] || { curl -fsSL -o sc.tar.gz https://steamcdn-a.akamaihd.net/client/installer/steamcmd_linux.tar.gz && tar xzf sc.tar.gz; }
          set +e
          timeout 90 ./steamcmd.sh +login "$STEAM_USER" "$STEAM_PASS" +quit > probe.log 2>&1
          RC=$?
          set -e
          # classify WITHOUT leaking secrets
          if grep -qiE 'Steam Guard|Two-factor|two factor|set_steam_guard_code' probe.log; then
            echo "PROBE RESULT: STEAM_GUARD — account requires a one-time code (pass via steam_guard_code input once)"
          elif grep -qiE 'Invalid Password|FAILED login|error code Five' probe.log; then
            echo "PROBE RESULT: INVALID PASSWORD — fix the STEAM_PASS secret"
          elif grep -qiE 'waiting for user to enter|confirmation code|email' probe.log; then
            echo "PROBE RESULT: STEAM_GUARD_EMAIL — code sent to the account email"
          elif grep -qi 'Logged in OK' probe.log; then
            echo "PROBE RESULT: LOGGED_IN_OK — credentials valid, NO guard on account"
          else
            echo "PROBE RESULT: OTHER (rc=$RC) — see steamcmd-probe.log artifact"
            tail -15 probe.log | sed 's/[A-Za-z0-9@#$%^&*()_+-]\{8,\}/[redacted]/g'
          fi
          cp -f probe.log "$C2B_NODE_HOME/steamcmd-probe.log" 2>/dev/null || true

      - name: bootstrap steam client (first run downloads runtime)
        run: |
          if [ -x "$HOME/.local/share/Steam/steam.sh" ]; then echo "steam cached, skip bootstrap"; exit 0; fi
          (steam --silent >/tmp/steam-bootstrap.log 2>&1 &) || true
          for i in $(seq 1 60); do
            [ -x "$HOME/.local/share/Steam/steam.sh" ] && sleep 20 && echo "bootstrap done (~$((i*5+20))s)" && exit 0
            sleep 5
          done
          echo "::warning::steam bootstrap may be incomplete; steam-login.sh will retry"

      - name: steam login (burner account)
        run: |
          if [ -z "$STEAM_USER" ]; then
            echo "STEAM_USER not set — skipping login (smoke boots standalone; full mode needs the burner account)"
            exit 0
          fi
          bash scripts/steam-login.sh || {
            if [ "$MODE" = "smoke" ]; then
              echo "::warning::steam login failed — continuing (smoke boots standalone; a Steam Guard code may be needed once)"
              tail -50 /tmp/c2b-steam-login.log || true
            else
              echo "::error::steam login failed — set STEAM_USER/STEAM_PASS, and for the"
              echo "          very first run pass STEAM_GUARD_CODE (email code) via workflow input."
              tail -50 /tmp/c2b-steam-login.log || true
              exit 1
            fi
          }

      # ---------- e2e ----------
      - name: run e2e (${{ env.MODE }})
        run: |
          cp -f scripts/steam-login.sh "$C2B_NODE_HOME/steam-login.sh"
          echo "$C2B_TARGET" > "$C2B_NODE_HOME/target.conf"
          if [ "$MODE" = "smoke" ]; then
            # observe mode: bridge preloaded but NOT patching (the translate
            # GOT-patch crashes protobuf init on the runner's glibc - run 16
            # gdb backtrace). Smoke only needs menu + preload evidence.
            # 5 attempts: the protobuf static-init SEGV is nondeterministic
            # (survived in 37128611184 a2, died in 37135148290 a1-a3) - retry
            # through it; a dead attempt costs ~15s since the liveness fix.
            C2B_SMOKE=1 C2B_TRANSLATE=0 C2B_ATTEMPTS=5 bash run-test-node.sh
          else
            bash run-test-node.sh
          fi

      # ---------- artifacts ----------
      - name: collect artifacts
        if: always()
        run: |
          L=$(ls -t "$C2B_NODE_HOME/runs/" 2>/dev/null | head -1) || true
          mkdir -p e2e-out
          [ -n "$L" ] && cp -f "$C2B_NODE_HOME/runs/$L"/* e2e-out/ 2>/dev/null || true
          # steam session evidence (duplicate-safe if harness already saved it)
          cp -f ~/.steam/steam/logs/console-linux.txt e2e-out/steam-console.log 2>/dev/null || true
          cp -f ~/.local/share/Steam/config/loginusers.vdf e2e-out/loginusers.vdf 2>/dev/null || true
          cp -f /tmp/c2b-steam-login.log e2e-out/steam-login.log 2>/dev/null || true
          cp -f /tmp/c2b-steam-login-diag.txt e2e-out/steam-login-diag.txt 2>/dev/null || true
          cp -f "$C2B_NODE_HOME/steamcmd-probe.log" e2e-out/ 2>/dev/null || true
          # remaining client logs (connection_log etc.) + Xvfb screenshots:
          # the login form / guard dialog text IS the answer
          mkdir -p e2e-out/steam-logs
          for f in ~/.steam/steam/logs/*.txt ~/.local/share/Steam/logs/*.txt; do
            [ -f "$f" ] || continue
            b=$(basename "$f")
            [ "$b" = console-linux.txt ] || tail -c 200000 "$f" > "e2e-out/steam-logs/$b"
          done 2>/dev/null || true
          if command -v import >/dev/null 2>&1 && pgrep -f 'Xvfb :99' >/dev/null 2>&1; then
            DISPLAY=:99 import -window root e2e-out/xvfb-state.png 2>/dev/null || true
          fi
          echo "=== verdict ==="; cat e2e-out/verdict.txt 2>/dev/null || true
          echo "=== harness tail ==="; tail -30 e2e-out/harness.log 2>/dev/null || true
          echo "=== login session ==="; grep -ao '"mostrecent"\s*"1"' e2e-out/loginusers.vdf 2>/dev/null || echo "NO LOGIN SESSION"

      - name: upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-cloud-${{ env.MODE }}-${{ github.run_id }}
          path: e2e-out/
          retention-days: 30

      # ---------- cache save (explicit, survives failed e2e verdicts) ----------
      - name: save bundle cache
        if: always() && steps.cache-bundle.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/csgo-lite
          key: csgo-lite-v1
      - name: save steam client cache
        if: always() && steps.cache-steam.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.local/share/Steam
            ~/.steam
          key: steam-node-v2
