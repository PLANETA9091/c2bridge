name: bundle-smoke

# Checks that the PRIVATE MEGA bundle (CS:GO lite client pack) is reachable
# with the stored secret. Downloads NOTHING except the listing - cheap guard
# so a broken link/expired quota is caught before any e2e job wastes time.
#
# Required repo secrets (Settings -> Secrets and variables -> Actions):
#   MEGA_USER / MEGA_PASS   - MEGA account (recommended), or:
#   MEGA_URL                - full private folder link "https://mega.nz/folder/ID#KEY"
#
# Policy: Valve assets NEVER enter this repo. They live only in the private
# MEGA folder; credentials live only in Actions secrets.

on:
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * 1" # weekly sanity check, Monday 04:00 UTC

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: install rclone (official build — distro rclone lacks the mega backend)
        run: |
          set -euo pipefail
          if ! command -v rclone >/dev/null || ! rclone help backends 2>/dev/null | grep -qw mega; then
            curl -fsSL -o /tmp/rclone.deb https://downloads.rclone.org/rclone-current-linux-amd64.deb
            sudo apt-get install -y -qq /tmp/rclone.deb
          fi
          rclone help backends 2>/dev/null | grep -qw mega || { echo "::error::rclone has no mega backend"; exit 1; }

      - name: verify bundle reachable
        env:
          MEGA_USER: ${{ secrets.MEGA_USER }}
          MEGA_PASS: ${{ secrets.MEGA_PASS }}
          MEGA_DIR: ${{ secrets.MEGA_DIR }}
          MEGA_URL: ${{ secrets.MEGA_URL }}
        run: |
          set -e
          if [[ -n "${MEGA_USER}" && -n "${MEGA_PASS}" ]]; then
            rclone config create c2bmega mega \
              user "$MEGA_USER" pass "$(rclone obscure "$MEGA_PASS")" >/dev/null
            R="c2bmega:${MEGA_DIR:-csgo}"
          elif [[ -n "${MEGA_URL}" ]]; then
            R=":mega,link=${MEGA_URL}:"
          else
            echo "::error::no MEGA secrets configured"; exit 1
          fi
          rclone size "$R"
          echo "--- first files ---"
          rclone lsl "$R" | head -20
